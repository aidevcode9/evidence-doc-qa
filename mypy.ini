[mypy]
python_version = 3.11
strict = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true
pretty = true

# Module discovery
mypy_path = apps/api
namespace_packages = true
explicit_package_bases = true

# Ignore missing imports for third-party libraries without stubs
[mypy-marker.*]
ignore_missing_imports = true

[mypy-llama_parse.*]
ignore_missing_imports = true

[mypy-pypdf.*]
ignore_missing_imports = true

[mypy-openai.*]
ignore_missing_imports = true

[mypy-azure.*]
ignore_missing_imports = true

[mypy-sqlalchemy.*]
ignore_missing_imports = true

[mypy-dotenv.*]
ignore_missing_imports = true

[mypy-fastapi.*]
ignore_missing_imports = true

[mypy-pydantic.*]
ignore_missing_imports = true

[mypy-uvicorn.*]
ignore_missing_imports = true

[mypy-httpx.*]
ignore_missing_imports = true

[mypy-PIL.*]
ignore_missing_imports = true

[mypy-opentelemetry.*]
ignore_missing_imports = true

[mypy-tiktoken.*]
ignore_missing_imports = true

[mypy-numpy.*]
ignore_missing_imports = true

[mypy-evidence_shared.*]
ignore_missing_imports = true

[mypy-alembic.*]
ignore_missing_imports = true

[mypy-langfuse]
ignore_missing_imports = true

[mypy-langfuse.*]
ignore_missing_imports = true
