<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" font-family="Segoe UI, system-ui, sans-serif">
  <title>Evidence-Bound Architecture — Legal Document Q&amp;A Platform</title>
  <style>
    .title { font-size: 22px; font-weight: 700; fill: #1e1e1e; }
    .subtitle { font-size: 13px; fill: #757575; }
    .zone-label { font-size: 13px; font-weight: 600; }
    .box-label { font-size: 13px; fill: #1e1e1e; text-anchor: middle; }
    .box-label-sm { font-size: 11px; fill: #1e1e1e; text-anchor: middle; }
    .note { font-size: 10px; fill: #757575; }
    .pipe-title { font-size: 13px; font-weight: 600; fill: #92400e; }
    .pipe-flow { font-size: 10.5px; fill: #555; }
    .crosscut { font-size: 10.5px; fill: #555; }
    .legend { font-size: 11.5px; fill: #555; }
  </style>

  <!-- Title -->
  <text x="480" y="28" text-anchor="middle" class="title">Evidence-Bound Architecture</text>
  <text x="480" y="46" text-anchor="middle" class="subtitle">Legal Document Q&amp;A Platform (Multi-Tenant RAG) — Azure Cloud</text>

  <!-- ============ FRONTEND ZONE ============ -->
  <rect x="20" y="60" width="920" height="100" rx="10" fill="#dbe4ff" fill-opacity="0.4" stroke="#4a9eed" stroke-width="1"/>
  <text x="35" y="78" class="zone-label" fill="#2563eb">Frontend (Next.js 16 / Vercel)</text>

  <rect x="40" y="90" width="150" height="50" rx="8" fill="#a5d8ff" stroke="#4a9eed" stroke-width="1.5"/>
  <text x="115" y="112" class="box-label">My Matters</text>
  <text x="115" y="128" class="box-label-sm">Dashboard</text>

  <rect x="210" y="90" width="155" height="50" rx="8" fill="#a5d8ff" stroke="#4a9eed" stroke-width="1.5"/>
  <text x="287" y="112" class="box-label">Chat + Citations</text>
  <text x="287" y="128" class="box-label-sm">Interface</text>

  <rect x="385" y="90" width="130" height="50" rx="8" fill="#a5d8ff" stroke="#4a9eed" stroke-width="1.5"/>
  <text x="450" y="112" class="box-label">Document</text>
  <text x="450" y="128" class="box-label-sm">Viewer</text>

  <rect x="535" y="90" width="130" height="50" rx="8" fill="#a5d8ff" stroke="#4a9eed" stroke-width="1.5"/>
  <text x="600" y="112" class="box-label">Admin</text>
  <text x="600" y="128" class="box-label-sm">Console</text>

  <rect x="685" y="90" width="150" height="50" rx="8" fill="#a5d8ff" stroke="#4a9eed" stroke-width="1.5"/>
  <text x="760" y="112" class="box-label">Login / SSO</text>
  <text x="760" y="128" class="box-label-sm">(Google OIDC)</text>

  <!-- Arrow: Frontend → API -->
  <line x1="480" y1="140" x2="480" y2="170" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <text x="505" y="160" font-size="10" fill="#6d28d9">httpOnly JWT</text>

  <!-- ============ API ZONE ============ -->
  <rect x="20" y="170" width="920" height="190" rx="10" fill="#e5dbff" fill-opacity="0.4" stroke="#8b5cf6" stroke-width="1"/>
  <text x="35" y="188" class="zone-label" fill="#6d28d9">API Layer (FastAPI / Azure Container Apps)</text>

  <!-- Middleware chain -->
  <rect x="40" y="200" width="120" height="46" rx="8" fill="#d0bfff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="100" y="220" class="box-label">Auth + RBAC</text>
  <text x="100" y="236" class="box-label-sm">JWT / SSO</text>

  <rect x="175" y="200" width="125" height="46" rx="8" fill="#d0bfff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="237" y="220" class="box-label">Tenant Context</text>
  <text x="237" y="236" class="box-label-sm">Extraction</text>

  <rect x="315" y="200" width="110" height="46" rx="8" fill="#d0bfff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="370" y="220" class="box-label">Rate Limit</text>
  <text x="370" y="236" class="box-label-sm">(slowapi)</text>

  <!-- Chain arrows -->
  <line x1="160" y1="223" x2="175" y2="223" stroke="#6d28d9" stroke-width="1.5" marker-end="url(#arrowSmall)"/>
  <line x1="300" y1="223" x2="315" y2="223" stroke="#6d28d9" stroke-width="1.5" marker-end="url(#arrowSmall)"/>

  <!-- Endpoints -->
  <rect x="445" y="200" width="130" height="46" rx="8" fill="#d0bfff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="510" y="220" class="box-label">POST /v1/ask</text>
  <text x="510" y="236" class="box-label-sm">Orchestrator</text>

  <rect x="590" y="200" width="120" height="46" rx="8" fill="#d0bfff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="650" y="220" class="box-label">Docs Upload</text>
  <text x="650" y="236" class="box-label-sm">+ Ingestion</text>

  <rect x="725" y="200" width="110" height="46" rx="8" fill="#d0bfff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="780" y="220" class="box-label">Metrics</text>
  <text x="780" y="236" class="box-label-sm">+ Health</text>

  <rect x="850" y="200" width="80" height="46" rx="8" fill="#d0bfff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="890" y="220" class="box-label">Audit</text>
  <text x="890" y="236" class="box-label-sm">Logs</text>

  <line x1="425" y1="223" x2="445" y2="223" stroke="#6d28d9" stroke-width="1.5" marker-end="url(#arrowSmall)"/>

  <!-- RAG Pipeline -->
  <rect x="40" y="268" width="895" height="55" rx="8" fill="#fff3bf" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="55" y="286" class="pipe-title">RAG Pipeline (ask_service.py)</text>
  <text x="55" y="306" class="pipe-flow">Injection Gate &#x2192; Embed Query &#x2192; Hybrid Search &#x2192; Parallel Verify (3x ThreadPool) &#x2192; Auto-Verify Fast Path &#x2192; Grade Evidence &#x2192; Build Citations</text>

  <!-- Arrows from pipeline to data layer -->
  <line x1="180" y1="323" x2="180" y2="380" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="370" y1="323" x2="370" y2="380" stroke="#e8940b" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <line x1="540" y1="323" x2="540" y2="380" stroke="#e8940b" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <line x1="700" y1="323" x2="700" y2="380" stroke="#e8940b" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <!-- ============ DATA ZONE ============ -->
  <rect x="20" y="370" width="920" height="210" rx="10" fill="#d3f9d8" fill-opacity="0.4" stroke="#22c55e" stroke-width="1"/>
  <text x="35" y="388" class="zone-label" fill="#15803d">Data + External Services (Azure)</text>

  <rect x="40" y="405" width="170" height="60" rx="8" fill="#c3fae8" stroke="#22c55e" stroke-width="1.5"/>
  <text x="125" y="430" class="box-label" font-size="14" font-weight="600">PostgreSQL</text>
  <text x="125" y="448" class="box-label-sm">(Azure Flex Server)</text>
  <text x="45" y="480" class="note">11 tables, tenant_id on all</text>
  <text x="45" y="494" class="note">QueuePool 10+20, pre_ping</text>

  <rect x="240" y="405" width="180" height="60" rx="8" fill="#ffd8a8" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="330" y="430" class="box-label" font-size="14" font-weight="600">Azure AI Search</text>
  <text x="330" y="448" class="box-label-sm">BM25 + Vector + Semantic</text>
  <text x="245" y="480" class="note">15s timeout, tenant OData filter</text>
  <text x="245" y="494" class="note">Semantic reranker (cross-encoder)</text>

  <rect x="450" y="405" width="170" height="60" rx="8" fill="#ffd8a8" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="535" y="430" class="box-label" font-size="14" font-weight="600">Azure OpenAI</text>
  <text x="535" y="448" class="box-label-sm">GPT-5-mini</text>
  <text x="455" y="480" class="note">Embed + Verify + Answer</text>
  <text x="455" y="494" class="note">Retry 3x, backoff 1s/2s/4s</text>

  <rect x="650" y="405" width="130" height="60" rx="8" fill="#ffd8a8" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="715" y="430" class="box-label" font-size="14" font-weight="600">Azure Blob</text>
  <text x="715" y="448" class="box-label-sm">Storage</text>
  <text x="655" y="480" class="note">PDF/Image uploads</text>

  <rect x="810" y="405" width="120" height="60" rx="8" fill="#eebefa" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="870" y="430" class="box-label" font-size="14" font-weight="600">Langfuse</text>
  <text x="870" y="448" class="box-label-sm">LLM Traces</text>
  <text x="815" y="480" class="note">PII-safe, no raw text</text>
  <text x="815" y="494" class="note">NFR-045 compliant</text>

  <!-- Cross-cutting concerns -->
  <rect x="40" y="520" width="895" height="38" rx="8" fill="#fff3bf" fill-opacity="0.6" stroke="#f59e0b" stroke-width="1"/>
  <text x="55" y="544" class="crosscut">Cross-cutting:  httpx pool (50 conn, HTTP/2)  |  OpenTelemetry spans + custom metrics  |  Embedding LRU cache (5K entries)  |  Query TTL cache (500 entries, 1h)</text>

  <!-- Legend -->
  <text x="30" y="590" class="legend" fill="#555">Tenant/Matter isolation enforced at every layer: JWT context extraction &#x2192; RBAC permission check &#x2192; DB WHERE tenant_id = ? &#x2192; Azure Search OData filter</text>

  <!-- Roles -->
  <rect x="30" y="610" width="900" height="28" rx="6" fill="#f0f0f0" stroke="#ccc" stroke-width="1"/>
  <text x="45" y="629" font-size="11" fill="#555">
    RBAC Roles:  Admin (full access)  |  Attorney (query, upload, export)  |  Paralegal (query, upload, export)  |  Viewer (query, export only)
  </text>

  <!-- Versions -->
  <text x="30" y="665" font-size="10" fill="#999">Stack: Python 3.12 / FastAPI / Next.js 16 / PostgreSQL / httpx / SQLAlchemy / OpenTelemetry / Langfuse  |  582 tests, 0 failures  |  2026-03-31</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowPurple" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#8b5cf6"/>
    </marker>
    <marker id="arrowSmall" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#6d28d9"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#22c55e"/>
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e8940b"/>
    </marker>
  </defs>
</svg>