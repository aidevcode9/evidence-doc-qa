name: ci

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  # ... (lint, typecheck, test jobs)
  run_evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install uv
          uv pip install -e . --system
      - name: Seed Eval Data
        env:
          DB_DATABASE_URL: "sqlite:///./ci_test.db"
          EMBEDDINGS_MODE: "local"
        run: python seed_eval_data.py
      - name: Start API
        env:
          DB_DATABASE_URL: "sqlite:///./ci_test.db"
          DOCQA_ENABLE_INDEXING: "0"
          EMBEDDINGS_MODE: "local"
        run: |
          uvicorn apps.api.app.main:app --host 0.0.0.0 --port 8000 &
          sleep 5
      - name: Run evals
        env:
          EVAL_API_URL: "http://localhost:8000"
        run: python -m evals.run --suite golden
