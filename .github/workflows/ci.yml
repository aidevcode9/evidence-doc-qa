name: ci

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  # ... (lint, typecheck, test jobs)
  run_evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install packages/shared/python
          python -m pip install -r apps/api/requirements.txt
      - name: Seed Eval Data
        env:
          DATABASE_URL: "sqlite:///./ci_test.db"
          EMBEDDINGS_MODE: "local"
          PYTHONPATH: ".:apps/api"
        run: python -m evals.seed
      - name: Start API
        env:
          DATABASE_URL: "sqlite:///./ci_test.db"
          DOCQA_ENABLE_INDEXING: "0"
          EMBEDDINGS_MODE: "local"
          PYTHONPATH: ".:apps/api"
        run: |
          uvicorn apps.api.app.main:app --host 0.0.0.0 --port 8000 &
          sleep 5
      - name: Run evals
        env:
          EVAL_API_URL: "http://localhost:8000"
        run: python -m evals.run --suite golden

  telemetry_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for raw httpx calls bypassing telemetry wrapper
        run: |
          VIOLATIONS=$(grep -rn "httpx\.\(post\|get\)" apps/api/app/ | grep -v telemetry | grep -v test | grep -v __pycache__ || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::Raw httpx calls found bypassing telemetry wrapper:"
            echo "$VIOLATIONS"
            exit 1
          fi
          echo "✓ All httpx calls go through telemetry wrapper"
