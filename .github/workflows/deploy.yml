name: deploy-backend

on:
  push:
    branches: ["main"]
    paths:
      - 'apps/api/**'
      - 'packages/shared/**'
      - 'infra/**'
      - '.github/workflows/deploy.yml'

permissions:
  id-token: write
  contents: read

jobs:
  infra-and-deploy:
    runs-on: ubuntu-latest
    env:
      RESOURCE_GROUP: doc-qa-demo
      LOCATION: centralus
      PREFIX: docqa
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Provision Infrastructure
        id: provision
        uses: azure/arm-deploy@v2
        with:
          resourceGroupName: ${{ env.RESOURCE_GROUP }}
          template: ./infra/main.bicep
          parameters: >
            location=${{ env.LOCATION }}
            vercelUrl=${{ secrets.VERCEL_URL }}
            searchServiceEndpoint=${{ secrets.AZURE_SEARCH_ENDPOINT }}
            searchServiceApiKey=${{ secrets.AZURE_SEARCH_API_KEY }}
            databaseUrl=${{ secrets.DATABASE_URL }}
            metricsAdminToken=${{ secrets.METRICS_ADMIN_TOKEN }}
          failOnStdErr: false

      - name: Get Infrastructure Outputs
        run: |
          echo "WEB_APP_NAME=${{ steps.provision.outputs.webAppName }}" >> $GITHUB_ENV

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.WEB_APP_NAME }}
          package: apps/api
