name: deploy-backend

on:
  push:
    branches: ["main"]
    paths:
      - 'apps/api/**'
      - 'packages/shared/**'
      - 'infra/**'
      - '.github/workflows/deploy.yml'

permissions:
  id-token: write
  contents: read

jobs:
  infra-and-deploy:
    runs-on: ubuntu-latest
    env:
      RESOURCE_GROUP: doc-qa-demo
      PREFIX: docqa
      APP_PATH: apps/api
      ARTIFACT_FILE: build/api-package.zip
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Package API artifact
        run: |
          mkdir -p build
          cd ${{ env.APP_PATH }}
          chmod +x startup.sh
          if [ ! -f "startup.sh" ]; then
            echo "startup.sh missing from package root" >&2
            exit 1
          fi
          zip -r "$GITHUB_WORKSPACE/${{ env.ARTIFACT_FILE }}" . -x ".*" "__pycache__/*" "*.pyc" "tests/*" ".git/*"
          echo "Artifact contents (top):"
          unzip -l "$GITHUB_WORKSPACE/${{ env.ARTIFACT_FILE }}" | head -n 50
          unzip -l "$GITHUB_WORKSPACE/${{ env.ARTIFACT_FILE }}" | grep -n "startup.sh" || (echo "startup.sh not in artifact" >&2 && exit 1)

      - name: Provision Infrastructure
        id: provision
        uses: azure/arm-deploy@v2
        with:
          resourceGroupName: ${{ env.RESOURCE_GROUP }}
          template: ./infra/main.bicep
          parameters: >
            vercelUrl=${{ secrets.VERCEL_URL }}
            searchServiceEndpoint=${{ secrets.AZURE_SEARCH_ENDPOINT }}
            searchServiceApiKey=${{ secrets.AZURE_SEARCH_API_KEY }}
            databaseUrl=${{ secrets.DATABASE_URL }}
            metricsAdminToken=${{ secrets.METRICS_ADMIN_TOKEN }}
          failOnStdErr: false

      - name: Get Infrastructure Outputs
        run: |
          echo "WEB_APP_NAME=${{ steps.provision.outputs.webAppName }}" >> $GITHUB_ENV

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.WEB_APP_NAME }}
          package: ${{ env.ARTIFACT_FILE }}
